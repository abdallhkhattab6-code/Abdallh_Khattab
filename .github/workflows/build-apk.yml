
name: Build Lantern Shadows APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract game
        run: unzip -q lantern-shadows-mobile.zip -d project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Create Android project
        working-directory: project
        run: npx cap add android

      - name: Generate assets
        working-directory: project
        run: npx capacitor-assets generate --android

      - name: Configure Android
        working-directory: project
        run: node scripts/patch-android.mjs

      - name: Sync game
        working-directory: project
        run: npx cap sync android

      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lantern-shadows-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          
